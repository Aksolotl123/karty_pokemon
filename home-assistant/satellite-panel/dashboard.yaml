# Dashboard "Panel Kuchnia" (url: /panel-kuchnia/panel) — kopia konfiguracji z HA
views:
  - title: Panel
    path: panel
    type: panel
    cards:
      - type: custom:satellite-panel-card
        satellite: assist_satellite.vaca_57b6a763f
        name: Kuchnia
        wake_word: Okay Nabu
        weather: weather.forecast_dom
        info:
          - { entity: lock.zamek, name: Zamek, icon: mdi:lock }
          - { entity: binary_sensor.czujnik_drzwi_drzwi_wejsciowe_contact, name: Drzwi wejściowe, icon: mdi:door }
          - { entity: sensor.dom_produkcja_dzis, name: Fotowoltaika dziś, icon: mdi:solar-power-variant }
          - { entity: sensor.czujnik_obecnosci_a_pokoj_marceliny_temperature, name: Pokój Marceliny, icon: mdi:thermometer }
        tiles_title: Kuchnia
        tiles:
          - { entity: switch.wlacznik_swiatla_kuchnia_l2, name: Światło 1, icon: mdi:ceiling-light-outline, icon_on: mdi:ceiling-light }
          - { entity: switch.wlacznik_swiatla_kuchnia_l1, name: Światło 2, icon: mdi:ceiling-light-outline, icon_on: mdi:ceiling-light }
          - { entity: light.listwa_led_w_kuchni, name: Listwa LED, icon: mdi:led-strip-variant }
          - { entity: light.reflektor_3, name: Lampa, icon: mdi:lightbulb-outline, icon_on: mdi:lightbulb }
          - { entity: switch.wlacznik_swiatla_nad_stolem, name: Nad stołem, icon: mdi:ceiling-light-multiple-outline, icon_on: mdi:ceiling-light-multiple }
          - { entity: switch.wlacznik_kuchnia_tv_ekspres_itp, name: TV i ekspres, icon: mdi:coffee-maker-outline, icon_on: mdi:coffee-maker }
          - { entity: switch.wlacznik_plyta_indukcyjna, name: Płyta indukcyjna, icon: mdi:stove, confirm: true }
          - { entity: switch.wlacznik_zmywarka_pompka, name: Zmywarka, icon: mdi:dishwasher, confirm: true }
        scenes_title: Sceny
        scenes:
          - { entity: script.zgas_wszystkie_swiatla, name: Zgaś światła, icon: mdi:lightbulb-group-off, confirm: true }
          - { entity: script.zamknij_i_zgas_wszystko, name: Wychodzę, icon: mdi:home-lock, confirm: true }
          - { entity: script.karmienie_kotow_porcja, name: Nakarm koty, icon: mdi:cat, confirm: true }
